name: CameraCoach CC21 Swift numeric parity
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc21-swift-parity.yml']
permissions:
  contents: read
jobs:
  parity:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/dataset/cc21
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0'
      - name: Compile Swift encoder and compare all non-image input features
        run: python tools/dataset/cc21/check_swift_v21.py
      - uses: actions/upload-artifact@v4
        with:
          name: cc21-swift-parity-proof
          path: cc21-swift-proof/
          retention-days: 30
