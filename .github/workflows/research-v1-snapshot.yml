name: research-v1-source-snapshot
on:
  push:
    branches: [research/experiment-v1-20261111]
    paths: [.github/workflows/research-v1-snapshot.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export immutable evidence (no models, media, secrets, or app changes)
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('research-evidence')
          root.mkdir()
          refs = {'store': '93f5daa3c91d791c5a5230f6731a359d74dd2946', 'data': 'ce9344d83e81d0950af1935fcf305eab5cb61306', 'main': '018ceab5d87c43d0c1a17600a2e43d5e4e55a308'}
          prefixes = ('ml/camera_coach/intent_pilot/', 'ml/camera_coach/data/', 'docs/cameraanalysis/eval/', 'docs/cameraanalysis/dataset/', 'docs/cameraanalysis/annotation/', 'datasets/camera-coach/v1/', 'tools/cameraanalysis/', 'tools/datasets/', 'tools/dataset/', 'tools/human_eval/', 'tools/tests/', 'docs/thesis/', 'scripts/tests/', 'scripts/evidence/')
          exact = {'AGENTS.md', 'shafinMultitool/Resources/DeviceBenchmark/camera_device_benchmark_pack_v1/camera_full_labels.jsonl'}
          extensions = {'.py', '.json', '.jsonl', '.md', '.csv', '.txt', '.yml', '.yaml'}
          manifest = []
          total = 0
          for lane, sha in refs.items():
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', sha], check=True)
              listing = subprocess.check_output(['git', 'ls-tree', '-rl', sha], text=True)
              for line in listing.splitlines():
                  meta, path = line.split('\t', 1)
                  mode, kind, blob, size = meta.split()
                  if kind != 'blob' or int(size) > 6000000:
                      continue
                  if lane == 'main' and path != 'AGENTS.md':
                      continue
                  if path not in exact and not (path.startswith(prefixes) and pathlib.PurePosixPath(path).suffix in extensions):
                      continue
                  if lane == 'data' and not path.startswith(('tools/', 'datasets/')) and path != 'AGENTS.md':
                      continue
                  data = subprocess.check_output(['git', 'show', sha + ':' + path])
                  expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  assert expected == blob, path
                  total += len(data)
                  if total > 150000000:
                      raise RuntimeError('Snapshot safety size limit exceeded')
                  out = root / lane / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
                  manifest.append({'lane': lane, 'commit': sha, 'path': path, 'bytes': len(data), 'git_blob': blob, 'sha256': hashlib.sha256(data).hexdigest()})
          (root / 'SOURCE_MANIFEST.json').write_text(json.dumps({'refs': refs, 'files': manifest, 'bytes': total}, indent=2), encoding='utf-8')
          print(json.dumps({'files': len(manifest), 'bytes': total, 'refs': refs}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-v1-pinned-evidence
          path: research-evidence/
          retention-days: 30
          if-no-files-found: error
