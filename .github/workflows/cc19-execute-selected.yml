name: CameraCoach CC19 actual selected data execution
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc19-execute-selected.yml']
permissions:
  contents: read
  actions: read
jobs:
  dependency-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc19
            tools/dataset/cc17
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' requests
          PYTHONPATH=tools/dataset/cc17:tools/dataset/cc19 python -c 'import release_pack,execute_selected,selected_reader,selection_v19,secure_joint_audit; print(selection_v19.selection_metadata_test())'
  joint-selected:
    needs: dependency-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc19
            tools/dataset/cc17
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dd9cc68c3e1c12fb913a4a8590b55ff0bbdff2ed
          path: frozen
          sparse-checkout: tools/dataset/cc17
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated data-only recipient
        run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' requests
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
          python -m py_compile tools/dataset/cc19/execute_selected.py tools/dataset/cc19/selected_reader.py
          umask 077
          openssl req -x509 -newkey rsa:3072 -nodes -keyout audit-private.pem -out audit-public.pem -days 1 -subj '/CN=CameraCoach-Same-Job-Audit' >/dev/null 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: cc19-audit-public-recipient
          path: audit-public.pem
          retention-days: 1
      - name: Restore worker output and execute every selected real pixel batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u tools/dataset/cc19/execute_selected.py joint --key "$PWD/audit-private.pem"
      - name: Freshly restore the final encrypted archive and compare every batch
        run: |
          PYTHONPATH="$PWD/frozen/tools/dataset/cc17:$PWD/tools/dataset/cc19" python - <<'PY'
          import json,subprocess
          from pathlib import Path
          import secure_joint_audit as J
          import selected_reader as S
          r=json.loads(Path('delivery/RELEASE.json').read_text())
          cipher=Path('frozen')/(r['label']+'.tar.gz.cms')
          assert J.sha(cipher)==r['encrypted_sha256']
          subprocess.run(['openssl','cms','-decrypt','-binary','-inform','DER','-in',str(cipher),'-inkey','audit-private.pem','-out','selected_restore.tar.gz'],check=True)
          assert J.sha('selected_restore.tar.gz')==r['plaintext_sha256']
          restored=J.extract_checked(Path('selected_restore.tar.gz'),Path('selected_clean_restore'))
          original=S.verify(Path('selected_core'));repeat=S.verify(Path('selected_clean_restore'))
          assert original==repeat
          J.dump('proof/SELECTED_TENSOR_QA.json',original)
          J.dump('proof/SELECTED_ARCHIVE_RESTORE_QA.json',{'fresh_clean_restore':restored,'all_actual_tensor_streams_identical':True,'source':'local finalized encrypted artifact, not Google Drive','actual_Drive_restore':False,'model_calls':0})
          status={'component_data_ready':True,'component_scope':original['component_scope'],'full_cameracoach_training_ready':False,'model_execution_authorized':False,'model_calls':0,'new_human_responses':0,'selected_records':original['selected_records'],'selected_scenes':original['scene_configurations'],'verified_split_records':{k:v['records'] for k,v in original['split_checks'].items()},'actual_Drive_restore':False,'fresh_archive_restore':True,'private_runtime_error':'ClientError in the conversation execution environment; no Drive plaintext restoration claimed','source':'actual frozen-generator replay, real selected pixel batches, and clean final archive restore'}
          J.dump('proof/FINAL_COMPONENT_STATUS.json',status)
          print('CC19_FINAL_SELECTED_STATUS '+json.dumps(status))
          PY
      - uses: ./.github/actions/cc17-upload
      - uses: actions/upload-artifact@v4
        with:
          name: cc19-actual-selected-proof
          path: proof/
          retention-days: 30
      - name: Remove ephemeral private recipient
        if: always()
        run: rm -f audit-private.pem
  source-workers:
    needs: dependency-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/dataset/cc19
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dd9cc68c3e1c12fb913a4a8590b55ff0bbdff2ed
          path: frozen
          sparse-checkout: tools/dataset/cc17
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned simulator
        run: python -m pip install --quiet 'bpy==4.5.0' 'numpy==1.26.4' 'Pillow==11.3.0' requests
      - name: Replay accepted immutable source configurations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u tools/dataset/cc19/execute_selected.py worker --shard '${{ matrix.shard }}' > worker.log 2>&1 || { tail -n 35 worker.log; exit 1; }
          grep '^CC19_REPLAY_COMPLETE\|^CC18_FINAL_QA' worker.log
      - uses: actions/upload-artifact@v4
        with:
          name: cc19-replay-shard-${{ matrix.shard }}
          path: replay/
          compression-level: 0
          retention-days: 7
