name: CameraCoach CC18 complete synthetic component
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc18-complete-synthetic.yml']
permissions:
  contents: read
jobs:
  semantic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned data-only renderer
        run: |
          python -m pip install --quiet 'bpy==4.5.0' 'numpy==1.26.4' 'Pillow==11.3.0' requests
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
          python -m py_compile tools/dataset/cc17/complete_synthetic.py tools/dataset/cc17/cc18_run.py
      - name: Verify all families and conditional tensor contract
        run: |
          python -u tools/dataset/cc17/cc18_run.py --shard 0 --shards 1 --count 8 --label-prefix cc18-preflight > render.log 2>&1 || { tail -n 35 render.log; exit 1; }
          grep '^CC18_SUMMARY\|^CC17_RELEASE' render.log
      - uses: ./.github/actions/cc17-upload
  complete-corpus:
    needs: semantic-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned data-only renderer
        run: |
          python -m pip install --quiet 'bpy==4.5.0' 'numpy==1.26.4' 'Pillow==11.3.0' requests
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Render every candidate and validate all data batches
        run: |
          python -u tools/dataset/cc17/cc18_run.py --shard '${{ matrix.shard }}' --shards 8 --count 512 > render.log 2>&1 || { tail -n 35 render.log; exit 1; }
          grep '^CC18_SUMMARY\|^CC17_RELEASE' render.log
      - uses: ./.github/actions/cc17-upload
