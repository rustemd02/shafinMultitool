name: CameraCoach CC20 finish real lighting
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-finish-real-lighting.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: ['00','03','extra']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'requests==2.32.5'
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Download all selected native files and execute every task batch twice
        run: python -u tools/dataset/cc20/lighting_complete.py --part '${{ matrix.part }}'
      - uses: ./.github/actions/cc17-upload
      - uses: actions/upload-artifact@v4
        with:
          name: cc20-lighting-proof-${{ matrix.part }}
          path: proof/
          retention-days: 30
