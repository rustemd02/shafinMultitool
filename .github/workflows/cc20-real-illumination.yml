name: CameraCoach CC20 real illumination corpus
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-real-illumination.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'requests==2.32.5'
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Acquire complete real light-series manifest
        run: python -u tools/dataset/cc20/illumination_real.py
      - uses: ./.github/actions/cc17-upload
