name: CameraCoach CC20 captureguide complete evaluation
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-captureguide-complete.yml']
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' requests
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Verify valid zero-crop targets and idempotent source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          p=Path('tools/dataset/cc20/captureguide_adapter.py');s=p.read_text()
          replacements={
            'np.allclose(expected,crops,atol=1e-9)':'np.allclose(expected,np.asarray(crops,float).reshape(-1,4),atol=1e-9,rtol=0)',
            "boxes[i,:n]=target['acceptable_crops_xyxy']":"boxes[i,:n]=np.asarray(target['acceptable_crops_xyxy'],np.float32).reshape(-1,4)"}
          for before,after in replacements.items():
              if s.count(before)==1:s=s.replace(before,after)
              elif s.count(before)==0 and s.count(after)==1:pass
              else:raise ValueError('Unexpected source shape')
          p.write_text(s);compile(s,str(p),'exec')
          assert np.allclose(np.zeros((0,4)),np.asarray([],float).reshape(-1,4))
          a=np.zeros((1,3,4),np.float32);a[0,:0]=np.asarray([],np.float32).reshape(-1,4)
          print('CC20_ZERO_CROP_REGRESSION_PASS')
          PY
      - name: Exact native joins, author parity, all actual pixel batches
        run: python -u tools/dataset/cc20/captureguide_adapter.py
      - name: Match the already delivered actual tensor stream
        run: |
          python - <<'PY'
          import json
          q=json.load(open('cc20-captureguide-evaluation/QA.json'))
          assert q['records_ready']==567 and q['author_parser_agreement_records']==567
          assert q['native_decision_counts']=={'reject':134,'crop':337,'keep':96}
          assert q['actual_tensor_stream_sha256']=='749b590c4a9584ac26649e6234a344b1530fd42e0b7c98c4f59b3958563500cc'
          assert q['train_loader_rejected'] and q['models_called']==0
          print('CC20_INDEPENDENT_REBUILD_TENSOR_MATCH_PASS')
          PY
      - uses: ./.github/actions/cc17-upload
