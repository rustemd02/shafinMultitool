name: CameraCoach native photoreal subject and view corpus
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-hypersim-native-build.yml']
permissions:
  contents: read
jobs:
  first-native-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'h5py==3.11.0' 'requests==2.32.5'
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
          python -m py_compile tools/dataset/cc20/hypersim_native.py
      - name: Acquire actual native HDR and annotations; validate every batch
        run: python -u tools/dataset/cc20/hypersim_native.py --shard 0 --shards 8
      - uses: ./.github/actions/cc17-upload
  remaining-native-partitions:
    needs: first-native-partition
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'h5py==3.11.0' 'requests==2.32.5'
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Acquire source-locked scenes without mixing official splits
        run: python -u tools/dataset/cc20/hypersim_native.py --shard '${{ matrix.shard }}' --shards 8
      - uses: ./.github/actions/cc17-upload
