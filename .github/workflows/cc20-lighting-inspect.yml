name: CameraCoach CC20 native lighting inspection
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-lighting-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect official source structure and calibration without model calls
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CameraCoach-CC20-native-data-inspection'}),timeout=60) as r:return r.read()
          repo='OpenIllumination/OpenIllumination'
          info=json.loads(get('https://huggingface.co/api/datasets/'+repo));sha=info['sha']
          print('CC20_META '+json.dumps({'repo':repo,'sha':sha,'gated':info.get('gated'),'cardData':info.get('cardData')}))
          base='https://huggingface.co/datasets/'+repo+'/resolve/'+sha+'/'
          for path in ['README.md','open_illumination.py']:
            try: print('CC20_TEXT '+json.dumps({'path':path,'text':get(base+path).decode()[:22000]}))
            except Exception as e:print('CC20_ERROR',path,str(e))
          tree=json.loads(get('https://huggingface.co/api/datasets/'+repo+'/tree/'+sha+'?limit=1000'))
          print('CC20_TREE '+json.dumps(tree))
          for d in [x['path'] for x in tree if x['type']=='directory'][:4]:
            sub=json.loads(get('https://huggingface.co/api/datasets/'+repo+'/tree/'+sha+'/'+d+'?limit=1000'))
            print('CC20_SUBTREE '+json.dumps({'path':d,'entries':sub[:30]}))
          for url in ['https://raw.githubusercontent.com/lmurmann/multi_illumination/master/README.md','https://raw.githubusercontent.com/lmurmann/multi_illumination/master/multilum.py']:
            try: print('CC20_MIT '+json.dumps({'url':url,'text':get(url).decode()[:16000]}))
            except Exception as e:print('CC20_ERROR',url,str(e))
          PY
