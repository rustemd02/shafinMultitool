name: CameraCoach CC20 real video components
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-real-video-components.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: [holoassist_real, objectron_real]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested binary media reader
        run: |
          python -m pip install --quiet --only-binary=:all: 'numpy==1.26.4' 'Pillow==11.3.0' 'requests==2.32.5' 'av==18.1.0' 'grpcio-tools==1.68.1'
          python -c "import av,numpy; print('CC20_MEDIA_READER',av.__version__,av.library_versions)"
          sed -i 's/av==14.4.0/av==18.1.0/g' tools/dataset/cc20/real_common.py
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Acquire native media and execute data-only QA
        run: python -u 'tools/dataset/cc20/${{ matrix.component }}.py'
      - uses: ./.github/actions/cc17-upload
