name: CameraCoach v17 complete ACaM test corpus
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc17-curate-acam.yml']
permissions:
  contents: read
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            .github/actions/cc17-upload
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --quiet requests numpy pillow
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - run: python3 tools/dataset/cc17/curate_acam.py
      - uses: ./.github/actions/cc17-upload
