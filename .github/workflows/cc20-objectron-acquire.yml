name: CameraCoach CC20 real handheld acquisition
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-objectron-acquire.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: google-research-datasets/Objectron
          ref: 46daaa0aca5b2e704bbc8deb99b0863bc9bf19a7
          path: official_objectron
          sparse-checkout: |
            objectron/schema
            index
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'protobuf==3.20.3' 'requests==2.32.5'
          sudo apt-get update -qq > /tmp/apt.log 2>&1
          sudo apt-get install -y -qq ffmpeg >> /tmp/apt.log 2>&1
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Validate native frame join and actual pixel task reader
        run: python -u tools/dataset/cc20/objectron_data.py --pilot
      - uses: ./.github/actions/cc17-upload
  acquire:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: google-research-datasets/Objectron
          ref: 46daaa0aca5b2e704bbc8deb99b0863bc9bf19a7
          path: official_objectron
          sparse-checkout: |
            objectron/schema
            index
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'protobuf==3.20.3' 'requests==2.32.5'
          sudo apt-get update -qq > /tmp/apt.log 2>&1
          sudo apt-get install -y -qq ffmpeg >> /tmp/apt.log 2>&1
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Collect native video and protobuf and read every training record twice
        run: python -u tools/dataset/cc20/objectron_data.py --shard '${{ matrix.shard }}' --per-class 8
      - uses: ./.github/actions/cc17-upload
      - uses: actions/upload-artifact@v4
        with:
          name: cc20-objectron-proof-${{ matrix.shard }}
          path: proof/
          retention-days: 30
