name: CameraCoach v17 existing artifact delivery
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc17-delivery-parts.yml']
permissions:
  contents: read
  actions: read
jobs:
  split:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: cc17-et-core-encrypted
            run: 39777605185
            label: et-core
          - name: cc17-acam-real-encrypted
            run: 39778195327
            label: acam-real
          - name: cc17-acam-syn-encrypted
            run: 39778195327
            label: acam-syn
          - name: cc17-rapidata-media-0-encrypted
            run: 39778399872
            label: rapidata-0
          - name: cc17-rapidata-media-1-encrypted
            run: 39778399872
            label: rapidata-1
          - name: cc17-rapidata-media-2-encrypted
            run: 39778399872
            label: rapidata-2
          - name: cc17-rapidata-media-3-encrypted
            run: 39778399872
            label: rapidata-3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: source
      - name: Split encrypted bytes and retain exact ordering
        id: split
        env:
          LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          root=pathlib.Path('source');out=pathlib.Path('parts');out.mkdir()
          src=list(root.glob('*.cms'));assert len(src)==1
          src=src[0];full=hashlib.sha256();parts=[]
          with src.open('rb') as f:
            for i in range(100):
              data=f.read(480*1024*1024)
              if not data:break
              p=out/(os.environ['LABEL']+'.p'+str(i).zfill(3))
              p.write_bytes(data);full.update(data)
              parts.append({'name':p.name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          receipts=[json.loads(p.read_text()) for p in root.glob('*.json')]
          assert len(receipts)==1 and full.hexdigest()==receipts[0]['encrypted_sha256']
          assert len(parts)<=8
          (out/'PARTS.json').write_text(json.dumps({'label':os.environ['LABEL'],'original_name':src.name,'original_sha256':full.hexdigest(),'parts':parts,'transport':receipts[0]},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('count='+str(len(parts))+'\n')
          print('PARTS_READY',os.environ['LABEL'],len(parts),sum(p['size'] for p in parts))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 0 }}
        with:
          name: cc17-part-${{ matrix.label }}-000
          path: |
            parts/${{ matrix.label }}.p000
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 1 }}
        with:
          name: cc17-part-${{ matrix.label }}-001
          path: |
            parts/${{ matrix.label }}.p001
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 2 }}
        with:
          name: cc17-part-${{ matrix.label }}-002
          path: |
            parts/${{ matrix.label }}.p002
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 3 }}
        with:
          name: cc17-part-${{ matrix.label }}-003
          path: |
            parts/${{ matrix.label }}.p003
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 4 }}
        with:
          name: cc17-part-${{ matrix.label }}-004
          path: |
            parts/${{ matrix.label }}.p004
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 5 }}
        with:
          name: cc17-part-${{ matrix.label }}-005
          path: |
            parts/${{ matrix.label }}.p005
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 6 }}
        with:
          name: cc17-part-${{ matrix.label }}-006
          path: |
            parts/${{ matrix.label }}.p006
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.split.outputs.count > 7 }}
        with:
          name: cc17-part-${{ matrix.label }}-007
          path: |
            parts/${{ matrix.label }}.p007
            parts/PARTS.json
          compression-level: 0
          retention-days: 7
