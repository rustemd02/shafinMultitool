name: CameraCoach CC18 native ShotBench supplement
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc18-shotbench-supplement.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            .github/actions/cc17-upload
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --quiet requests numpy pillow
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Download native archive, validate SHA and recover exact referenced clips
        run: python3 -u tools/dataset/cc17/cc18_shotbench_supplement.py
      - uses: ./.github/actions/cc17-upload
