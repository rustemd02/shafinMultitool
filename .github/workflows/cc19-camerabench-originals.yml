name: CameraCoach CC19 native CameraBench missing-video recovery
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc19-camerabench-originals.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc19
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare bounded source decoding
        run: |
          python -m pip install --quiet 'av==16.0.1' 'imageio-ffmpeg==0.6.0' 'numpy==1.26.4' 'Pillow==11.3.0' requests
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Exact native joins then source and derivative decoding
        run: python -u tools/dataset/cc19/recover_camerabench_entry.py
      - uses: ./.github/actions/cc17-upload
