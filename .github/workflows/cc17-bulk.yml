name: CameraCoach v17 bulk corpus
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc17-bulk.yml']
permissions:
  contents: read
jobs:
  acquire:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        corpus: [metadata, et-core, acam-real, acam-syn]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/dataset/cc17
          persist-credentials: false
      - name: Install data-only readers
        run: python3 -m pip install --quiet requests pyarrow numpy
      - name: Acquire and validate native payload
        run: python3 tools/dataset/cc17/acquire.py '${{ matrix.corpus }}'
      - name: Retain encrypted private payload only
        uses: actions/upload-artifact@v4
        with:
          name: cc17-${{ matrix.corpus }}-encrypted
          path: delivery/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
