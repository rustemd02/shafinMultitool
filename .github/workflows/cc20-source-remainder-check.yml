name: CameraCoach CC20 remaining source checks
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-source-remainder-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [holo, orientation]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet --only-binary=:all: 'numpy==1.26.4' 'Pillow==11.3.0' 'requests==2.32.5' 'av==18.1.0'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Check original-source remainder without substitute labels
        run: python -u tools/dataset/cc20/check_unmatched_and_orientation.py '${{ matrix.task }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cc20-source-diagnostic-${{ matrix.task }}
          path: cc20-native-diagnostics/
          retention-days: 30
