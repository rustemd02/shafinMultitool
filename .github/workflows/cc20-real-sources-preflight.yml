name: CameraCoach CC20 real supervision preflight
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-real-sources-preflight.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data readers only
        run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'requests==2.32.5' 'grpcio-tools==1.68.1'
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Fetch native source samples and schema
        run: python -u tools/dataset/cc20/probe_real_sources.py
      - uses: ./.github/actions/cc17-upload
