name: CameraCoach CC18 restore and consumer tests
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc18-handoff.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/dataset/cc17
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'bpy==4.5.0' 'numpy==1.26.4' 'Pillow==11.3.0' requests
      - name: Test code without accessing the owner's private key
        run: |
          python -u tools/dataset/cc17/build_handoff.py > tests.log 2>&1 || { tail -n 30 tests.log; exit 1; }
          grep '^CC18_HANDOFF_TESTS' tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: cc18-handoff-tools
          path: handoff/*
          if-no-files-found: error
          retention-days: 7
