name: CameraCoach CC20 real lighting acquisition
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc20-real-lighting.yml']
permissions:
  contents: read
jobs:
  native-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'requests==2.32.5'
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Decode native sample, validate masks and run every task batch twice
        run: python -u tools/dataset/cc20/real_lighting.py --pilot
      - uses: ./.github/actions/cc17-upload
  full-selected-subset:
    needs: native-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            tools/dataset/cc20
            .github/actions/cc17-upload
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.3.0' 'requests==2.32.5'
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Collect all native bytes in this shard and check all real-image batches
        run: python -u tools/dataset/cc20/real_lighting.py --shard '${{ matrix.shard }}' --shards 4
      - uses: ./.github/actions/cc17-upload
