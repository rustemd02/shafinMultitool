name: CameraCoach CC18 available ACaM evaluation corpus
on:
  push:
    branches: ['data/cameracoach-v17-acquisition-20261022']
    paths: ['.github/workflows/cc18-acam-available.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/dataset/cc17
            .github/actions/cc17-upload
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --quiet requests numpy pillow
          npm install --no-audit --no-fund --silent @actions/artifact@2.3.2
      - name: Acquire, decode, join and quarantine missing original media
        run: python3 -u tools/dataset/cc17/cc18_acam_available.py
      - uses: ./.github/actions/cc17-upload
